{% extends "layout/base.html" %}

{% block content %}
<div class="flex flex-col justify-between mx-auto w-full max-w-5xl px-6 py-8">
    <h1 class="text-[28px] leading-[34px] tracking-[-0.416px] text-slate-12 font-bold ">
        {{_('Users')}}
    </h1>
    <div class="card card-bordered  shadow-sm mt-4">
        <div class="overflow-x-auto">
            <table class="table">
                <!-- head -->
                <thead>
                    <tr>
                        <!-- <th>
                            <label>
                                <input type="checkbox" class="checkbox" />
                            </label>
                        </th> -->
                        <th>Name</th>
                        <th>Job</th>
                        <th>Favorite Color</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <!-- <th>
                            <label>
                                <input type="checkbox" class="checkbox" />
                            </label>
                        </th> -->
                        <td>
                            <div class="flex items-center gap-3">
                                <div class="avatar">
                                    <div class="mask mask-squircle h-12 w-12">
                                        <img src="{{ user.get_avatar }}"
                                            alt="Avatar Tailwind CSS Component" />
                                    </div>
                                </div>
                                <div>
                                    <div class="font-bold">{{user.username}}</div>
                                    <div class="text-sm opacity-50">United States</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            Zemlak, Daniel and Leannon
                            <br />
                            <span class="badge badge-ghost badge-sm">Desktop Support Technician</span>
                        </td>
                        <td>Purple</td>
                        <th>
                            <button class="btn btn-ghost btn-xs">details</button>
                        </th>
                    </tr>
                    {%endfor %}
                    
                </tbody>
                <!-- foot -->
                <tfoot>
                    <tr>
                        <th>Name</th>
                        <th>Job</th>
                        <th>Favorite Color</th>
                        <th></th>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
    {% endblock %}
